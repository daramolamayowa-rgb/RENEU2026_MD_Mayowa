# M2_propylammonium_octanoate
# Entry 2 of the ionic-liquid library in Section 4 of the research plan.
# This file is read by every run_stage*.sh script. Change NPAIR or NWATER only
# if you have a reason you can write down.

NAME="M2 propylammonium octanoate"
LIBRARY_ENTRY=2
CATION=propylammonium
ANION=octanoate
DONOR_MOTIF="N-H, carboxylate O-O"
TARGETS="La(III), Ce(III)"
SUBSTRATE="NdFeB magnet swarf"
STATUS="build-ready"

NPAIR=59          # ion pairs: gives a ~28 A box once NPT has compressed it
NWATER=236          # SPC/E water molecules for Stage 2 and Stage 3b
NWATER3A=500        # water molecules for the Stage 3a ion validation box
RHO_START=0.6     # g/cm3, deliberately expanded; NPT finds the real density
ION=nd              # Stage 3 ion. Nd(III) is the plan's representative 3+ ion.
