# M4_ethanolammonium_acetate
# Entry 5 of the ionic-liquid library in Section 4 of the research plan.
# This file is read by every run_stage*.sh script. Change NPAIR or NWATER only
# if you have a reason you can write down.

NAME="M4 ethanolammonium acetate"
LIBRARY_ENTRY=5
CATION=ethanolammonium
ANION=acetate
DONOR_MOTIF="N-H and O-H, carboxylate"
TARGETS="Nd(III), Pr(III)"
SUBSTRATE="Fluorescent-lamp phosphor dust"
STATUS="charge-rebalanced"

NPAIR=98          # ion pairs: gives a ~28 A box once NPT has compressed it
NWATER=392          # SPC/E water molecules for Stage 2 and Stage 3b
NWATER3A=500        # water molecules for the Stage 3a ion validation box
RHO_START=0.6     # g/cm3, deliberately expanded; NPT finds the real density
ION=nd              # Stage 3 ion. Nd(III) is the plan's representative 3+ ion.
