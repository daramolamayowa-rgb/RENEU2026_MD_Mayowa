# M1_butylammonium_octanoate
# Entry 1 of the ionic-liquid library in Section 4 of the research plan.
# This file is read by every run_stage*.sh script. Change NPAIR or NWATER only
# if you have a reason you can write down.

NAME="M1 butylammonium octanoate"
LIBRARY_ENTRY=1
CATION=butylammonium
ANION=octanoate
DONOR_MOTIF="N-H, carboxylate O-O"
TARGETS="Nd(III), Dy(III)"
SUBSTRATE="Spent NdFeB hard-disk and motor magnets"
STATUS="build-ready"

NPAIR=55          # ion pairs: gives a ~28 A box once NPT has compressed it
NWATER=220          # SPC/E water molecules for Stage 2 and Stage 3b
NWATER3A=500        # water molecules for the Stage 3a ion validation box
RHO_START=0.6     # g/cm3, deliberately expanded; NPT finds the real density
ION=nd              # Stage 3 ion. Nd(III) is the plan's representative 3+ ion.
