# M5_diethanolammonium_acetate
# Entry 8 of the ionic-liquid library in Section 4 of the research plan.
# This file is read by every run_stage*.sh script. Change NPAIR or NWATER only
# if you have a reason you can write down.

NAME="M5 diethanolammonium acetate"
LIBRARY_ENTRY=8
CATION=diethanolammonium
ANION=acetate
DONOR_MOTIF="two O-H plus N-H"
TARGETS="Nd(III), multidentate"
SUBSTRATE="NdFeB magnet leachate"
STATUS="charge-rebalanced"

NPAIR=72          # ion pairs: gives a ~28 A box once NPT has compressed it
NWATER=288          # SPC/E water molecules for Stage 2 and Stage 3b
NWATER3A=500        # water molecules for the Stage 3a ion validation box
RHO_START=0.6     # g/cm3, deliberately expanded; NPT finds the real density
ION=nd              # Stage 3 ion. Nd(III) is the plan's representative 3+ ion.
